defense:
  name: purified_vfl
  parameters:
    # ==================================================================
    # 最终组合 = 重指派（隐私主力）+ symmetric 软标签（六分类 amc 有效）
    # ==================================================================
    # 重指派：破坏"样本↔梯度"逐样本配对，唯一在真实 VFL 验证有效的机制
    # symmetric 软标签：六分类 amc 场景 LRA 0.458 -> 0.150（接近随机）
    # 二分类自动降为 K=1（恒等，完全 one-hot），不影响重指派
    trainingRecenterStrength: 0.5
    inferenceRecenterStrength: 1.0
    referenceMomentum: 0.99
    recenterMode: soft
    recenterDetectionThreshold: 3.0

    jitterForAttacks: villain

    normExcessStrength: 1.0
    normExcessFactor: 2.5

    # 重指派（样本↔梯度配对置换）
    gradientShuffleStrength: 1.0
    gradientShuffleLabelInferenceOnly: true
    gradientShufflePoisoningActiveOnly: true
    gradientShufflePoisoningBackdoors: ["lfba"]
    gradientShufflePoisonedOnly: false
    gradientShuffleBackdoorOnly: false

    # party dropout
    partyDropoutRate: 0.2
    partyDropoutLabelInferenceOnly: true

    gradientClipQuantile: 0.0
    gradientClipNorm: 0.0

    trainingJitter: 0.5
    jitterPoisonedOnly: true
    jitterWithLabelInference: false

    # symmetric 软标签（六分类 K=4 扩维；二分类自动 K=1 恒等）
    pseudoLabelStrength: 1.0
    labelAliasSymmetric: true
    labelAliasFactor: 4
    labelAliasSigma: 1.0
    pseudoLabelSeed: 11

    # 按数据集定制（experiment 层从 config["dataset"]["name"] 注入，非特征 hash）
    #   dataset_04（二分类，B 仅 7 维）：重指派无效，改用 party dropout 0.3
    #     pmc 恢复率 0.761 -> 0.239，amc 0.761 -> 0.701
    #   dataset_05（六分类）：composite(villain+pmc) 让重指派覆盖 villain + 取消 warmup 保护
    #     composite 恢复率 0.833 -> 0.683，且纯 villain ASR 0.020 -> 0.018（鲁棒更好）
    #   dataset_03 不能覆盖 villain（VILLAIN checkpoint 会中止），故不在此列
    datasetOverrides:
      dataset_04:
        partyDropoutRate: 0.3
      dataset_05:
        gradientShufflePoisoningBackdoors: ["lfba", "villain"]
        gradientShuffleWarmupProtect: false
