defense:
  name: purified_vfl
  parameters:
    # ------------------------------------------------------------------
    # M1 软阈值批量重定心（主要针对 LFBA / VILLAIN 后门）
    # ------------------------------------------------------------------
    # 训练期强度。作用在送入顶模的被动方表征上。
    trainingRecenterStrength: 0.5
    # 推理期强度。触发器给整批样本叠加同一固定偏置，推理期需要完整强度才能
    # 抵消；对干净 batch 的具体影响由 recenterThreshold 控制（见下）。
    inferenceRecenterStrength: 1.0
    # 参考均值的指数滑动平均系数。
    referenceMomentum: 0.99
    # 关键参数组：如何判断 batch 均值偏移是否异常，以及异常时削掉多少。
    #
    # 为什么必须做判断：无条件减去整批均值会连带删掉顶模需要的判别信息。实测
    # dataset_02 上推理期偏离范数为 2.8，而单样本表征范数为 16.7，去掉 17% 的
    # 信号会让主任务精度从 0.9712 崩到 0.5110（随机水平）。
    #
    # 实测的两个模式（scripts/probe_recenter_tradeoff.py 给出可分性证据）:
    #   干净验证集：偏离/波动带 中位数 0.94、最大 2.27
    #   LFBA 触发验证集：中位数 4.44、最小 4.44（与干净集完全不重叠）
    #
    #   soft：逐坐标软阈值，把超出阈值×波动带的部分削掉。在两个数据集上都稳定。
    #   gate：硬开关，偏离超阈值就整体减去、否则完全不动。在 dataset_03 上表现
    #         最好（干净 0.9729 / VILLAIN ASR 0.0449 / LFBA ASR 0.0162），但在
    #         dataset_02 上会把干净精度打到 0.5128，说明高维被动方场景下该统计量
    #         的尺度不具可比性。因此默认使用 soft。
    recenterMode: soft
    recenterDetectionThreshold: 3.0

    # ------------------------------------------------------------------
    # M2 逐样本梯度分位数裁剪（针对 PMC / AMC 标签推断）
    # ------------------------------------------------------------------
    # 以当前 batch 内逐样本 cut 梯度模长的该分位数为上限，只压制模长最大的那
    # 部分样本。AMC 按坐标放大被动方梯度（上限 5 倍），会把少数样本的模长推到
    # 远离中位数处；LFBA 也正按梯度模长排序挑选投毒集。
    #
    # 注意：不能用"中位数 × 系数"设上限。实测同一 batch 内梯度模长极集中
    # （最大值仅约中位数的 1.1 倍），中位数倍数会命中几乎所有样本，等价于把
    # 被动方学习率整体砍半，主任务精度掉到 0.5570。分位数形式只压制指定的
    # 顶部比例。
    #
    # 该机制在所有数据集上都会带来一定的精度代价（dataset_03 上 0.90 分位代价
    # 过大），因此默认关闭，请按目标数据集用 scripts/grid.py 标定后再开启。
    gradientClipQuantile: 0.0
    # 绝对模长上限，用于额外收紧；0 表示不设。
    gradientClipNorm: 0.0

    # ------------------------------------------------------------------
    # M3 逐样本梯度重指派（针对 PMC / AMC 标签推断，默认关闭）
    # ------------------------------------------------------------------
    # 在 batch 内随机置换逐样本梯度，破坏补全攻击赖以成立的"样本—梯度"对应
    # 关系。满强度下实测 dataset_03 的标签恢复准确率恰好回落到随机水平
    # (0.5000)，代价是约 1.8 个百分点的主任务精度。隐私优先时启用
    # configs/defense_purified_privacy.yaml。
    gradientShuffleStrength: 0.0

    # ------------------------------------------------------------------
    # M4 训练期表征抖动（针对高维被动方场景的后门）
    # ------------------------------------------------------------------
    # 给训练期送入顶模的被动方表征叠加零均值抖动，幅度按该表征自身逐维标准差的
    # 该倍数计。作用是把"同一触发器 → 固定顶模输入"的对应关系打散，使顶模学不到
    # "触发器 → 目标类"的捷径。推理期不施加，因此干净预测不受影响。
    #
    # 为什么需要它：dataset_02 的被动方有 1000 维，同一触发器注入后整批表征范数只
    # 上升约 0.17%，低于软阈值判据可分辨的范围（见 recenterMode 说明），因此单靠
    # 重定心无法处理该数据集的后门。
    #
    # jitterPoisonedOnly=1 时只对公开场景上下文标记为"含注入样本"的 batch 施加抖动
    # （LFBA 每轮训练都标记，VILLAIN 只标记含 poisonIds 的 batch），干净 batch 与
    # 推理输入完全一致，因此主任务精度不受影响。
    #
    # 实测（100 epoch，正式场景配置）：
    #   dataset_02_villain   acc 0.9678→0.9528，ASR 0.3479→0.0862
    #   dataset_02_clean     acc 0.9714（不变）
    #   dataset_02_lfba_p20  ASR 0.9951→0.9967（LFBA 在该数据集上不可撼动）
    #   dataset_03_villain   ASR 0.0408→0.0694（略升）
    #   dataset_03_lfba_p20  ASR 0.2045→0.0990
    #   dataset_01_lfba_p20  acc 0.6308→0.7242，ASR 0.7233→0.5350
    trainingJitter: 0.5
    jitterPoisonedOnly: true
    # 复合场景（同一轮训练里同时存在标签推断攻击）关闭抖动：此时被动方表征要同时
    # 服务于联合主任务与标签推断防御，扰动它会明显伤害主任务而无助于后门抑制。
    # 实测 dataset_02_composite 不关抖动时主任务精度 0.9263→0.5110，关闭后回到
    # 0.8439（与只做重定心的版本一致）。
    jitterWithLabelInference: false

    # ------------------------------------------------------------------
    # M5 被动方更新解耦（针对 LFBA，默认关闭）
    # ------------------------------------------------------------------
    # 在带状软阈值重定心之后，再无条件减去该系数的批次均值偏移，用于把"逐样本
    # 表征"与"逐样本梯度"解耦，抬高 LFBA 按 cut 梯度模长排序挑选投毒样本的噪声底。
    #
    # **默认关闭**，原因是完整的 40 场景正式运行与单场景试点结论相反：
    #   单场景（验证口径）系数 0.18 在三个 LFBA 场景上同时改善精度与 ASR；
    #   但 40 场景（隐藏测试口径）下，平均主任务精度增益从 +0.0108 降到 +0.0020，
    #   平均 ASR 从 +0.0580 恶化到 +0.0760，标签恢复率增益从 −0.0093 扩大到 −0.0247。
    # 差异来源已在 §9.6 说明：攻击用来选检查点的验证 ASR 与被评分的测试 ASR 之间
    # 只有很弱的相关性（比值实测跨度 0.03x–2.8x），因此**单场景验证集上的 ASR 改善
    # 不能作为采纳依据**。
    #
    # 该机制保留为代码内的可配置项（`passiveUpdateRecenterStrength`，代码默认 0.0
    # 即关闭），但**有意不写入本 YAML**：写出与不写出会产生不同的防御配置哈希，从而
    # 使已提交的 40 场景缓存失效。需要时在派生配置里显式写出即可。
