extends: ../dataset_04.yaml

backdoor:
  name: none
labelInference:
  name: amc
  auxiliaryLabelsPath: ../auxiliary_labels/dataset_04_pmc.csv
  completionLearningRate: 0.001
  completionEpochs: 20
  lambdaU: 10.0
  emaDecay: 0.995
  temperature: 0.8
  mixupAlpha: 0.75
  maliciousMomentum: 0.9
  maliciousDampening: 0.0
  gradientScaleGamma: 1.0
  minimumGradientScale: 1.0
  maximumGradientScale: 10.0
  gradientScaleEpsilon: 1.0e-7
output:
  directory: outputs/scenarios/dataset_04/amc
