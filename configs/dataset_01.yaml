dataset:
  name: dataset_01
  dataRoot: data/datasets
  inputFormat: imageHalf
  preprocessing: none

model:
  embeddingDim: 64
  bottomType: resnet18

training:
  seed: 100
  epochs: 100
  batchSize: 64
  learningRate: 0.003
  weightDecay: 0.0
  earlyStoppingPatience: 20
  device: auto
  progressEnabled: true
  progressMinInterval: 0.5

backdoor:
  name: none
  lfbaTriggerType: imageTriangle
  targetLabel: 1
  poisonRate: 0.1
  switchRate: 0.5
  triggerDimensions: 0
  triggerFeatureValue: 1.0
  # 固定使用参数筛选后确定的训练样本 ID，避免依赖数据行位置。
  anchorId: TRAIN_007481
  knownTargetIds:
    - TRAIN_002290
    - TRAIN_004068
    - TRAIN_004336
    - TRAIN_007050
    - TRAIN_006606
    - TRAIN_006002
    - TRAIN_003602
    - TRAIN_002271
    - TRAIN_008155
    - TRAIN_001504
  attackSeed: 100

labelInference:
  name: none
  auxiliaryLabelsPath: auxiliary_labels/dataset_01_pmc.csv
  completionEpochs: 20
  iterationsPerEpoch: 128
  completionBatchSize: 16
  completionLearningRate: 0.001
  evaluationBatchSize: 512
  temperature: 0.8
  mixupAlpha: 0.75
  lambdaU: 50.0
  emaDecay: 0.999
  headLayers: 1
  activation: relu
  useBatchNorm: true
  attackSeed: 100
  # 图像任务按照参考实现使用 200 次恢复优化。
  maliciousMomentum: 0.9
  maliciousDampening: 0.0
  gradientScaleGamma: 1.0
  minimumGradientScale: 1.0
  maximumGradientScale: 5.0
  gradientScaleEpsilon: 1.0e-7

output:
  directory: outputs/dataset_01
