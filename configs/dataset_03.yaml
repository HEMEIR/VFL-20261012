dataset:
  name: dataset_03
  dataRoot: data/datasets
  inputFormat: tabular
  preprocessing: none

model:
  embeddingDim: 64
  bottomType: mlp
  bottomHiddenDims: [128, 64, 32]

training:
  seed: 100
  epochs: 100
  batchSize: 64
  learningRate: 0.001
  weightDecay: 0.0
  earlyStoppingPatience: 20
  device: auto
  progressEnabled: true
  progressMinInterval: 0.5

backdoor:
  name: none
  lfbaTriggerType: structuredDimensions
  targetLabel: 1
  poisonRate: 0.1
  switchRate: 0.8
  triggerDimensions: 10
  triggerFeatureValue: 1.0
  anchorId: TRAIN_001956
  knownTargetIds:
    - TRAIN_000001
    - TRAIN_000003
    - TRAIN_000006
    - TRAIN_000008
    - TRAIN_000009
    - TRAIN_000010
    - TRAIN_000015
    - TRAIN_000016
    - TRAIN_000018
    - TRAIN_000019
  attackSeed: 100

labelInference:
  name: none
  auxiliaryLabelsPath: auxiliary_labels/dataset_03_pmc.csv
  completionEpochs: 10
  iterationsPerEpoch: 128
  completionBatchSize: 16
  completionLearningRate: 0.001
  evaluationBatchSize: 512
  temperature: 0.8
  mixupAlpha: 0.75
  lambdaU: 50.0
  emaDecay: 0.999
  headLayers: 1
  activation: relu
  useBatchNorm: true
  attackSeed: 100
  maliciousMomentum: 0.9
  maliciousDampening: 0.0
  gradientScaleGamma: 1.0
  minimumGradientScale: 1.0
  maximumGradientScale: 5.0
  gradientScaleEpsilon: 1.0e-7

output:
  directory: outputs/dataset_03
